services:
  migrate:
    image: migrate/migrate:v4.18.3
    container_name: financial-app-migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://financial:financial@postgres:5432/financial_app?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: financial-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial
      POSTGRES_DB: financial_app
    ports:
      - "${DB_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
